# OHIF Viewer Security Headers for Nginx
# Include this file in your nginx server block: include /path/to/security-headers.conf;
#
# Usage in nginx.conf:
#   server {
#       listen 443 ssl;
#       include /etc/nginx/security-headers.conf;
#       ...
#   }

# Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Enable XSS filter in older browsers
add_header X-XSS-Protection "1; mode=block" always;

# Control referrer information
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HTTP Strict Transport Security (HSTS)
# Only enable on HTTPS - forces browsers to use HTTPS for 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Restrict browser features/permissions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy
# Note: 'unsafe-inline' and 'unsafe-eval' are required for React and some dependencies
# In production, consider implementing nonces or hashes for inline scripts
#
# Directives:
# - default-src 'self': Only allow resources from same origin by default
# - script-src: Allow scripts from self, inline (React needs), eval (some deps), and blobs
# - style-src: Allow styles from self, inline, and Google Fonts
# - font-src: Allow fonts from self, Google Fonts, and data URIs
# - img-src: Allow images from self, data URIs, blobs, and any HTTPS source (for DICOM)
# - connect-src: Allow connections to self, any HTTPS (DICOMweb), WebSocket, and blobs
# - worker-src: Allow web workers from self and blobs
# - frame-ancestors 'none': Prevent embedding in iframes (like X-Frame-Options DENY)
# - base-uri 'self': Restrict base tag URLs
# - form-action 'self': Restrict form submissions
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
